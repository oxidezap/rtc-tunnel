# Vendored copy of `rtc` 0.21.0-rc.2, from crates.io, upstream commit
# 83c542e3f1a8e32c4f4f1409a3f4d1f598bc1f93.
#
# This is not a fork. It is the published source with the library manifest kept,
# the example and test targets dropped, and local patches applied under
# `patches/rtc/`. The patch list, the reason for each, and the condition that
# retires it live in `patches/rtc/README.md`.
#
# To update: replace `src` and the licenses from the new registry source, then
# reapply the patches. The manifest below only needs to change if upstream adds
# or removes a library dependency or feature.

[package]
name = "rtc"
version = "0.21.0-rc.2"
edition = "2024"
license = "MIT/Apache-2.0"
description = "Sans-I/O WebRTC implementation in Rust (vendored for rtc-tunnel)"
publish = false

[features]
crypto-aws-lc-rs = [
  "crypto/crypto-aws-lc-rs",
  "dtls/crypto-aws-lc-rs",
  "rustls/aws-lc-rs",
  "rcgen/aws_lc_rs",
  "ice/crypto-aws-lc-rs",
  "stun/crypto-aws-lc-rs",
  "srtp/crypto-aws-lc-rs",
  "turn/crypto-aws-lc-rs",
]
crypto-ring = [
  "crypto/crypto-ring",
  "dtls/crypto-ring",
  "rustls/ring",
  "rcgen/ring",
  "ice/crypto-ring",
  "stun/crypto-ring",
  "srtp/crypto-ring",
  "turn/crypto-ring",
]
default = ["crypto-ring"]

[lib]
name = "rtc"
path = "src/lib.rs"

[dependencies.bytes]
version = "1.12.0"

[dependencies.crypto]
version = "0.21.0-rc.2"
default-features = false
package = "rtc-crypto"

[dependencies.datachannel]
version = "0.21.0-rc.2"
package = "rtc-datachannel"

[dependencies.dtls]
version = "0.21.0-rc.2"
default-features = false
package = "rtc-dtls"

[dependencies.hex]
version = "0.4.3"

[dependencies.ice]
version = "0.21.0-rc.2"
default-features = false
package = "rtc-ice"

[dependencies.interceptor]
version = "0.21.0-rc.2"
package = "rtc-interceptor"

[dependencies.log]
version = "0.4.33"

[dependencies.mdns]
version = "0.21.0-rc.2"
package = "rtc-mdns"

[dependencies.media]
version = "0.21.0-rc.2"
package = "rtc-media"

[dependencies.pem]
version = "3.0.3"

[dependencies.rand]
version = "0.10.1"

[dependencies.rcgen]
version = "0.14.8"
features = ["pem"]
default-features = false

[dependencies.rtcp]
version = "0.21.0-rc.2"
package = "rtc-rtcp"

[dependencies.rtp]
version = "0.21.0-rc.2"
package = "rtc-rtp"

[dependencies.rustls]
version = "0.23.27"
features = ["std"]
default-features = false

[dependencies.sansio]
version = "1"

[dependencies.sctp]
version = "0.21.0-rc.2"
package = "rtc-sctp"

[dependencies.sdp]
version = "0.21.0-rc.2"
package = "rtc-sdp"

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.114"

[dependencies.shared]
version = "0.21.0-rc.2"
features = ["marshal", "replay"]
default-features = false
package = "rtc-shared"

[dependencies.srtp]
version = "0.21.0-rc.2"
default-features = false
package = "rtc-srtp"

[dependencies.stun]
version = "0.21.0-rc.2"
default-features = false
package = "rtc-stun"

[dependencies.turn]
version = "0.21.0-rc.2"
default-features = false
package = "rtc-turn"

[dependencies.unicase]
version = "2.8"

[dependencies.url]
version = "2.5.0"

[dependencies.x509-parser]
version = "0.16.0"
