name: Release

# release-please keeps a release PR up to date from conventional commits on
# main. Merging that PR tags the release, which is the only thing that triggers
# a publish, so the version bump stays reviewable.
on:
  push:
    branches: [main]
  # Recovery path for a tag whose publish failed outside the tag itself (a
  # runner missing a tool, a registry outage). Dispatch with the release tag
  # selected as the ref, never a branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 24

jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # The component lives in a non-root path, so release-please prefixes the
      # outputs with it. A path containing `/` needs bracket access.
      release_created: ${{ steps.release.outputs['packages/rtc-tunnel--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/rtc-tunnel--tag_name'] }}
      sha: ${{ steps.release.outputs['packages/rtc-tunnel--sha'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Split from publish on purpose: this is where the toolchain and test suites
  # run, and none of it can reach an OIDC token. It also builds the published
  # tree, which publish downloads rather than rebuilding.
  verify:
    name: Verify the tag
    needs: release-please
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false

      # A dispatch proves the ref is a tag, not that it is a release. Requiring
      # a GitHub release reachable from main ties the commit to the protected
      # branch, which a hand-pushed tag does not have.
      - name: Confirm the dispatch targets a release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical | behind) ;;
            *) echo "::error::$TAG is not on main ($status)"; exit 1 ;;
          esac
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG has no GitHub release; only release tags can be published"
            exit 1
          fi
          version=$(jq -r .version packages/rtc-tunnel/package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG does not match package version $version"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-16
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Install wasm tooling
        run: |
          scripts/install-wasm-tools.sh --dest "$RUNNER_TEMP/wasm-tools"
          echo "$RUNNER_TEMP/wasm-tools" >> "$GITHUB_PATH"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Everything the golden gate runs, on the exact commit being published.
      - name: Golden gate
        run: scripts/golden.sh

      # The wasm is not committed (it differs between machines), so stage the
      # artifact the golden gate just built into the package before recording
      # what publish must ship.
      - name: Stage the built wasm into the package
        run: node packages/rtc-tunnel/scripts/ensure-wasm.mjs

      # `dist/` plus the staged wasm are the whole package, so this digest set
      # is the tarball. Publish compares it after downloading.
      - name: Record the tree publish must ship
        run: |
          (cd packages/rtc-tunnel && find dist wasm -type f -print0 | sort -z | xargs -0r sha256sum) \
            > dist.sha256
          cat dist.sha256

      - name: Hand the verified build to publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: |
            packages/rtc-tunnel/dist
            packages/rtc-tunnel/wasm
            dist.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [release-please, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gate for the publish step: required reviewers here scope the OIDC trust
    # on npm.
    environment: npm-publish
    permissions:
      contents: read
      # Mints the short-lived token npm exchanges for publish rights. No
      # long-lived NPM_TOKEN lives in this repository.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false

      - name: Take the build verify vouched for
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: .

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Trusted publishing needs npm >= 11.5.1, above what some Node 24
      # releases bundle. Pinned rather than `latest`: this binary performs the
      # publish with the OIDC token.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.19.0

      - name: Fail unless the tree is byte-for-byte verify's
        run: |
          set -euo pipefail
          (cd packages/rtc-tunnel && find dist wasm -type f -print0 | sort -z | xargs -0r sha256sum) > dist.actual
          diff -u dist.sha256 dist.actual
          echo "publish: $(wc -l < dist.actual) files match the digests verify recorded"

      # No NODE_AUTH_TOKEN: trusted publishing authenticates over OIDC and
      # attaches provenance on its own.
      - run: npm publish packages/rtc-tunnel --ignore-scripts
